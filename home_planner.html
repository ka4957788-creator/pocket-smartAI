{% extends 'base.html' %}{% block title %}Home Planner{% endblock %}{% block content %}<div class="planner"><span class="pill">HOME INTERIOR</span><h1>Build your room plan</h1><form id="home-form"><label>Budget ₹<input id="budget" type="number" min="1" required></label><label>Rooms<input id="rooms" placeholder="Living Room, Bedroom" required></label><label>Items<input id="items" placeholder="Sofa, lights, dining table" required></label><label>Style<select id="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Contemporary</option></select></label><label>City<input id="city" value="Chennai"></label><button class="btn">Generate</button></form><div id="result"></div></div>{% endblock %}
