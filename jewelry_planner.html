{% extends 'base.html' %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<div class="planner"><span class="pill">JEWELRY</span><h1>Match jewelry to the occasion</h1><form id="jewelry-form" enctype="multipart/form-data"><label>Budget ₹<input id="budget" name="budget" type="number" min="1" required></label><label>Occasion<input id="occasion" name="occasion" placeholder="Wedding, party, festival" required></label><label>Style<select id="style" name="style"><option>Elegant</option><option>Minimal</option><option>Traditional</option><option>Statement</option></select></label><label>Outfit description<textarea id="outfit_description" name="outfit_description"></textarea></label><label>Optional outfit image<input id="outfit_image" name="outfit_image" type="file" accept=".jpg,.jpeg,.png,.webp"></label><button class="btn">Generate</button></form><div id="result"></div></div>{% endblock %}
