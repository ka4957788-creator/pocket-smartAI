{% extends 'base.html' %}{% block title %}Party Planner{% endblock %}{% block content %}<div class="planner"><span class="pill">PARTY</span><h1>Plan your event</h1><form id="party-form"><label>Budget ₹<input id="budget" type="number" min="1" required></label><label>Guests<input id="guests" type="number" min="1" required></label><label>Event type<input id="event_type" placeholder="Birthday, wedding, corporate" required></label><label>Venue<input id="venue" placeholder="Hotel, home, hall"></label><label>City<input id="city" value="Chennai"></label><label>Preferences<textarea id="preferences"></textarea></label><button class="btn">Generate</button></form><div id="result"></div></div>{% endblock %}
